<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FleetFlow | Login</title>

    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- =====================================================
             BRAND PANEL
        ====================================================== -->

        <section class="brand-panel">

            <div class="brand-content">

                <div class="brand-logo">
                    🚚
                </div>

                <h1>FleetFlow</h1>

                <p class="brand-subtitle">
                    Delivery & Logistics Management System
                </p>

                <div class="brand-divider"></div>

                <p class="brand-description">
                    Manage deliveries, drivers, vehicles, and
                    customers from one centralized platform.
                </p>

            </div>

        </section>


        <!-- =====================================================
             LOGIN PANEL
        ====================================================== -->

        <section class="login-panel">

            <div class="login-card">

                <!-- Header -->

                <div class="login-header">

                    <h2>Welcome Back</h2>

                    <p>
                        Sign in to your FleetFlow account
                    </p>

                </div>


                <!-- Login Form -->

                <form id="loginForm" autocomplete="on">

                    <!-- Username -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-container">

                            <span class="input-icon">
                                👤
                            </span>

                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter your username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-container">

                            <span class="input-icon">
                                🔒
                            </span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >
                                👁
                            </button>

                        </div>

                    </div>


                    <!-- Options -->

                    <div class="login-options">

                        <label class="remember-option">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>

                        <button
                            type="button"
                            id="forgotPassword"
                            class="forgot-button"
                        >
                            Forgot password?
                        </button>

                    </div>


                    <!-- Login Message -->

                    <div
                        id="loginMessage"
                        class="login-message"
                        role="alert"
                    ></div>


                    <!-- Login Button -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                    >

                        <span id="loginButtonText">
                            Sign In
                        </span>

                        <span
                            id="buttonLoader"
                            class="button-loader"
                        ></span>

                    </button>

                </form>


                <!-- Account Information -->

                <div class="login-info">

                    <div class="info-icon">
                        ℹ
                    </div>

                    <div>
                        <strong>FleetFlow Dispatcher</strong>

                        <p>
                            Authorized personnel only.
                        </p>
                    </div>

                </div>


                <!-- Footer -->

                <p class="login-footer">
                    FleetFlow &copy; 2026
                </p>

            </div>

        </section>

    </main>


    <script src="/js/login.js"></script>

</body>

</html>
